# Generic CI workflow generated by 24hour-ClaudeCode onboarder when no existing CI was detected.
# Project-specific commands are filled in by render-workflows.sh based on detect-project.sh output.
# Re-render after structure changes: bash scripts/render-workflows.sh
# To take manual control: delete the "Auto-generated" header line and edit freely.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master, develop, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # The following four steps are placeholders. The renderer fills in the
      # appropriate setup-* action and commands based on detected project type:
      #   - Node:    actions/setup-node@v4 → install (npm/pnpm/yarn/bun) → typecheck → lint → test → build
      #   - Python:  actions/setup-python@v5 → install (pip/poetry/uv) → ruff → mypy → pytest
      #   - Go:      actions/setup-go@v5 → go vet → go test ./...
      #   - Rust:    actions/setup-rust@v1 → cargo check → cargo clippy → cargo test
      # When manually generated (--static-templates), this template ships with Node + pnpm by default;
      # users edit to fit their project.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
        continue-on-error: false

      - run: pnpm run typecheck
        continue-on-error: false

      - run: pnpm test
