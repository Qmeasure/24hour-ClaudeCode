# ⚠️ STATIC FALLBACK TEMPLATE for Codex review
# Used by `bash scripts/configure-actions.sh --static-templates` when Codex is the chosen provider.
# Default render path: scripts/render-workflows.sh writes a project-tailored version.
#
# Reference: https://github.com/openai/codex-action

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "**/CHANGELOG*"
      - "**/*.lock"

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base + head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Load review prompt
        id: prompt
        run: |
          PROMPT_FILE=".claude/24hour-ClaudeCode/review-prompt.md"
          if [ -f "$PROMPT_FILE" ]; then
            { echo 'body<<__EOF__'; cat "$PROMPT_FILE"; echo; echo '__EOF__'; } >> "$GITHUB_OUTPUT"
          else
            echo 'body=Review this PR for correctness, security, and tests. Cite file:line for each finding.' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            ${{ steps.prompt.outputs.body }}

            PR: ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

      - name: Post review as PR comment
        if: ${{ steps.run_codex.outputs.final-message != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ steps.run_codex.outputs.final-message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$BODY"
