# Default static Codex review workflow template.
#
# Reference: https://github.com/openai/codex-action

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base + head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review PR ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            This is the default static template. Apply general best practices:
            - Cite file:line for every issue.
            - Group findings by severity: Reject / Major / Minor / Nit.
            - Skip trivial nits; lead with structural concerns.
            - Be concise.

      - name: Post review as PR comment
        if: ${{ steps.run_codex.outputs.final-message != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ steps.run_codex.outputs.final-message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$BODY"
