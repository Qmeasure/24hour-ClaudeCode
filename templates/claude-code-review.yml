# ⚠️ STATIC FALLBACK TEMPLATE
# This file is the generic, non-customized YAML used by:
#   bash scripts/configure-actions.sh --static-templates
#
# The DEFAULT path (without the flag) generates a tailored version via
# scripts/render-workflows.sh — that one knows your project type, test commands,
# style guides, and sensitive paths, and bakes them into the review prompt.
#
# Use this static template only if the renderer fails or you don't want
# auto-detection. Otherwise let `bash scripts/render-workflows.sh` produce
# the project-aware version.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "**/CHANGELOG*"
      - "**/*.lock"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write       # OIDC(必需)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --max-turns 5
            --model claude-sonnet-4-6
          use_sticky_comment: true
