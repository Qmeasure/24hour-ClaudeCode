# ⚠️ STATIC FALLBACK TEMPLATE
# This file is the generic, non-customized YAML used by:
#   bash scripts/configure-actions.sh --static-templates
#
# The DEFAULT path (without the flag) generates a tailored version via
# scripts/render-workflows.sh — that one knows your project type, test commands,
# style guides, and sensitive paths, and bakes them into the review prompt.
#
# Use this static template only if the renderer fails or you don't want
# auto-detection. Otherwise let `bash scripts/render-workflows.sh` produce
# the project-aware version.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "**/CHANGELOG*"
      - "**/*.lock"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write       # OIDC(必需)

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            At the end of the review, produce a machine-readable verdict for exactly PR head SHA ${{ github.event.pull_request.head.sha }}.
            Write it to review-verdict-${{ github.event.pull_request.head.sha }}.json if file writes are available.
            Also include the same JSON in the sticky PR comment hidden block:
            <!-- claude-review-verdict
            { ... }
            -->

            Verdict schema:
            {
              "schema_version": 1,
              "pr_number": ${{ github.event.pull_request.number }},
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "reviewer": "claude-code-action",
              "review_run_id": "${{ github.run_id }}",
              "verdict": "pass | fail | needs_human | inconclusive",
              "summary": "string",
              "blocking_findings": [
                {
                  "id": "stable-id",
                  "severity": "critical | major | minor",
                  "category": "correctness | security | test | maintainability | performance | compatibility",
                  "path": "src/file.ts",
                  "line": 42,
                  "title": "string",
                  "message": "string",
                  "evidence": "string",
                  "suggested_fix": "string"
                }
              ],
              "non_blocking_findings": [],
              "confidence": "high | medium | low"
            }

            Validation: verdict=pass requires blocking_findings=[]; verdict=fail requires at least one blocking finding; needs_human/inconclusive must not request automatic rework.
          claude_args: |
            --max-turns 5
            --model claude-sonnet-4-6
          use_sticky_comment: true

      - name: Upload review verdict
        if: ${{ hashFiles(format('review-verdict-{0}.json', github.event.pull_request.head.sha)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: review-verdict-${{ github.event.pull_request.head.sha }}
          path: review-verdict-${{ github.event.pull_request.head.sha }}.json
