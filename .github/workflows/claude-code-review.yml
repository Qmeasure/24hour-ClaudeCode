name: Claude Code Review

# Self-review workflow for the 24hour-ClaudeCode PLUGIN repo.
# This is meta: the plugin reviewing its own source changes. Review dimensions
# are plugin-architecture-specific, not generic code style.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review (Plugin Maintainer perspective)
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Custom prompt — this repo IS a Claude Code Plugin (24hour-ClaudeCode).
          # Review must check plugin-architecture invariants, not generic code style.
          prompt: |
            You are a senior Claude Code Plugin maintainer reviewing this PR.
            The repository is `24hour-ClaudeCode`, a published Claude Code plugin.
            Current architecture is skill-first:

            - `hooks/hooks.json` has a `SessionStart` command hook that runs
              `hooks/bootstrap.sh`.
            - `hooks/hooks.json` has a `Stop` prompt hook that only routes the
              current worktree session to the `review-loop` skill.
            - `skills/review-loop/SKILL.md` owns commit, push, PR creation,
              current-SHA review ingestion, rework, and merge.
            - `skills/github-actions-onboarding/SKILL.md` owns setup.
            - Scripts are limited to version sync and deterministic Superset
              file installation.

            Review against these current invariants:

            1. Plugin layout follows Claude Code plugin docs: `.claude-plugin/`
               contains only plugin metadata; `skills/`, `commands/`, `hooks/`,
               `scripts/`, and `templates/` are at plugin root.
            2. Hooks stay thin. Flag any commit, push, PR, review parsing, or
               merge orchestration added to a hook or hook script.
            3. Long workflows are skill-owned. `review-loop` and
               `github-actions-onboarding` must carry sequencing, judgment,
               stop conditions, and user-facing workflow rules.
            4. Worktree scope is enforced. Review-loop must not run from the
               main checkout or protected branches.
            5. Review evidence must come from real GitHub PR/check/comment
               surfaces and be bound to the current HEAD SHA. Missing, stale,
               or ambiguous evidence must stop, never pass.
            6. Rework stays in the same Claude Code session and same WorkTree.
               Do not spawn another Claude CLI or ask GitHub Action to repair.
            7. Onboarding is generic. It must not assume a language, package
               manager, test command, branch name, org, or hosting layout.
            8. Beginner docs (`README*.md`) must describe the current 3-step
               flow: install plugin, run setup in the main checkout/default
               branch, then start a fresh Claude session inside a feature
               worktree and use `/goal`.
            9. Shipped workflow templates must be generic and must not skip
               docs-only PRs unless that skip is explicitly justified.
            10. Do not reintroduce deleted legacy paths such as `hooks/stop.sh`,
                `hooks/goal-submit.sh`, `hooks/post-tool-use.sh`,
                `scripts/render-workflows.sh`, `scripts/runtime-state.sh`,
                `scripts/runtime-lock.sh`, or split phase skills.

            Format your output:
            - **Blocking issues** (must fix before merge): ≤ 3 items, file:line + reason + fix
            - **Major suggestions** (worth discussing): ≤ 5 items
            - **Minor / Nit**: skip unless cross-doc inconsistency or broken link
            - **What this PR does well**: 1–2 sentences, optional

            If the PR has no issues across these dimensions, post a single approval review:
            "Looks good — checked the current skill-first plugin architecture, no blocking issues."
            Do not invent issues to look thorough.
          claude_args: |
            --max-turns 6
            --model claude-sonnet-4-6
          use_sticky_comment: true
