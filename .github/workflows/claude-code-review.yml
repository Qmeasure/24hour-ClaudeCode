name: Claude Code Review

# Self-review workflow for the 24hour-ClaudeCode PLUGIN repo.
# This is meta — the plugin reviewing its own changes. Review dimensions are
# **plugin-architecture-specific**, not generic. When extending the plugin,
# also update templates/claude-code-review.yml + scripts/render-workflows.sh
# (which produce the workflow that ships to USER projects when they install
# this plugin — that one is generic project-review).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.lock"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review (Plugin Maintainer perspective)
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Custom prompt — this repo IS a Claude Code Plugin (24hour-ClaudeCode).
          # Review must check plugin-architecture invariants, not generic code style.
          prompt: |
            You are a senior Claude Code Plugin maintainer reviewing this PR.
            The repository is the `24hour-ClaudeCode` Plugin — a published Claude Code plugin
            that turns any git worktree into an autonomous PR loop (write code → SessionStart
            bootstraps → PostToolUse marks dirty → Stop hook commits/pushes/opens PR/polls
            CI/decides feedback → either auto-merges or returns `decision:block` to feed
            rework feedback back to the agent). Architecture details: `FLOW.md`.

            Your review is **not** generic code review. Evaluate against these
            Plugin-Maintainer dimensions:

            1. **Plugin manifest correctness** — `.claude-plugin/plugin.json` and
               `.claude-plugin/marketplace.json` must reference the same plugin name
               (`24hour-ClaudeCode`). Version bumps must use `scripts/bump-version.sh`
               so both files stay in sync. Flag any drift as **major**.

            2. **Hook architecture coherence** — three hooks have STRICT separation of duties:
               - `SessionStart` (`hooks/bootstrap.sh`): env detection + content injection
               - `PostToolUse` (`hooks/post-tool-use.sh`): light marker only (touches `<runtime>/dirty`)
               - `Stop` (`hooks/stop.sh`): the heavy worker (mode-aware orchestrator)

               Flag as **blocker** any change that:
               - Moves heavy logic from Stop to PostToolUse (wrong granularity, wastes turns)
               - Adds git operations to bootstrap or post-tool-use
               - Changes the matcher from `startup|clear|compact` for SessionStart (would lose `/clear`/auto-compact resilience)

            3. **State machine integrity** — `state.json.mode` ∈
               {`idle` | `waiting_for_checks` | `ready_for_rework` | `merged`}.
               Transitions in `hooks/stop.sh` must be consistent:
               - idle/ready_for_rework + diff → waiting_for_checks (push)
               - waiting_for_checks + feedback_good → merged (auto-merge)
               - waiting_for_checks + rework_required → ready_for_rework (decision:block)
               - merged → idle (cleanup pass)

               Flag any new mode that isn't documented in FLOW.md, or any case branch that
               leaks into a wrong mode.

            4. **decision:block contract** — the rework loop depends on `stop.sh` returning
               `{"decision":"block","reason":"..."}` JSON to stdout (NOT exit code 2). Any
               change to the emit_block helper or its callers must preserve this contract.
               Reference: official Claude Code hooks spec.

            5. **Cross-script consistency** — tokens used between scripts must agree:
               - `decide-feedback.sh` returns: `feedback_good | rework_required | inconclusive | stop:max_iterations`
               - `stop.sh` case-matches all four explicitly. Flag missing cases.
               - `check-stop-conditions.sh` returns: `continue | stop:protected_branch | stop:gh_auth_lost | stop:diff_too_large | stop:repeated_failure`
               - `stop.sh` handles all `stop:*` tokens. Flag drift.

            6. **Anti-pattern explicitness** — when behavior changes, the failure mode must
               be documented in `references/anti-patterns.md` (categories A–H). Each
               anti-pattern traces to a real failure scenario. Flag soft-touch additions
               that don't cite the failure mode they prevent.

            7. **Verbatim safety markers** — sections labeled `verbatim` / `iron law` /
               `Iron Law` / `<EXTREMELY-IMPORTANT>` MUST NOT be casually rewritten:
               - `references/monitor-template.md`'s 6 ironclad rules
               - `skills/using-24hour-ClaudeCode/SKILL.md` Iron Law
               - Bootstrap hook's `<EXTREMELY-IMPORTANT>` framing
               Flag any soft-touch edit to these as **blocker**.

            8. **Sub-skill orthogonality** — 8 skills under `skills/`, each owns ONE concern:
               using-24hour-ClaudeCode (bootstrap meta), github-actions-onboarding,
               ci-feedback-analysis, review-feedback-analysis, rework-implementation,
               verification-before-push, babysit-pr (manual ref only), failure-escalation.
               Flag content overlap or skill-name drift.

            9. **Reference orthogonality** — each `references/<topic>.md` covers one concern:
               monitor-template / quality-gate / decision-table / anti-patterns / blockers /
               workflow-yaml / superset-integration / official-docs-cheatsheet. Flag overlap.

            10. **Defensive state management** — atomic writes (`tmp + mv`), cooperative
                locks (mkdir + holder file), runtime files in auto-gitignored
                `<runtime>/` (never leaks to git diff). Verify any new state file follows
                this. Specifically: `runtime-state.sh`, `runtime-lock.sh` are the ONLY
                entry points for state mutations — flag direct file writes elsewhere.

            11. **Stale-lock detection** — `runtime-lock.sh acquire` must clear orphaned
                locks (PID dead AND >30 min old) before mkdir. Removing this would deadlock
                the runtime after any SIGKILL. Flag as **blocker**.

            12. **Onboarding flow correctness** — `scripts/configure-actions.sh` orders:
                gh auth → repo identify → App install + verify (poll 6×60s) → provider
                choice (claude/codex/both) → conditional Claude OAuth → render YAMLs →
                push → conditional OPENAI_API_KEY (Codex) → health check → optional
                Superset. Reordering skips can break Codex-only flow. Flag drift.

            13. **Bilingual triggers** — `.claude-plugin/plugin.json` `description` field
                AND `skills/using-24hour-ClaudeCode/SKILL.md` `description` accumulate
                Chinese + English trigger keywords. Removing or auto-translating them
                breaks user discovery. Flag deletion of existing keywords as **major**.

            14. **DoD measurability** — success state is PR `state=MERGED`. Not "auto-merge
                enabled". Not "CI green". Flag any softening of the DoD anywhere
                (`SKILL.md` / `README.md` / sub-skills / FLOW.md).

            15. **Internal link integrity** — `[text](path/to/file.md)` and `[text](#anchor)`
                in `SKILL.md` / `README.md` / `FLOW.md` / `CLAUDE.md` / sub-skills /
                references must resolve. Catch path drift after file moves.

            16. **Workflow YAML drift** — when `templates/claude-code-review.yml` changes
                (the version SHIPPED to user projects), confirm `.github/workflows/claude-code-review.yml`
                (this repo's self-review) still uses the **plugin-maintainer** dimensions
                above, NOT the generic project-review dimensions. They diverge by design.

            17. **Tone alignment** — the plugin's deliberate voice in user-facing docs is
                "approachable, plain-language, beginner-friendly with FAQ + scenarios"
                (README, FLOW, top-level docs). Internal docs (CLAUDE.md, references,
                sub-skills) are "anti-pattern-explicit, real-failure-driven, imperative".
                Don't blur the two. Don't auto-neutralize Chinese-friendly phrasings.

            18. **Workflow-file change discipline** — when a PR modifies
                `.github/workflows/*.yml`, those changes are subject to GitHub's
                workflow-validation 401 (the App refuses to auth on PR branches whose
                workflow files differ from default). The plugin handles this with the
                auto-split flow:
                - `scripts/split-workflow-pr.sh` peels workflow changes off into a
                  preflight PR with `gh pr merge --auto --squash` enabled
                - `hooks/stop.sh` Case A 1a–1c dispatches into it
                - `hooks/stop.sh` Case E (`mode=waiting_for_preflight_merge`)
                  polls + rebases on merge
                - Override knob: `repair.allow_workflow_in_pr` (default false)
                - State machine has 5 modes including `waiting_for_preflight_merge`

                Flag as **blocker**:
                - Any change that bundles workflow + code in a non-preflight PR
                  without setting `allow_workflow_in_pr=true` AND documenting why
                - Any change to `split-workflow-pr.sh` that drops the
                  committed-workflow-history refusal (out-of-scope for v1)
                - Any change to `stop.sh` that removes the workflow-bucket check
                  before the danger_paths check (ordering matters — preflight first)
                - Removing the branch-protection caveat from
                  `using-24hour-ClaudeCode/SKILL.md` or `CLAUDE.md`
                  (no-required-check-on-claude-review constraint)

            Format your output:
            - **Blocking issues** (must fix before merge): ≤ 3 items, file:line + reason + fix
            - **Major suggestions** (worth discussing): ≤ 5 items
            - **Minor / Nit**: skip unless cross-doc inconsistency or broken link
            - **What this PR does well**: 1–2 sentences, optional

            If the PR has no issues across all 18 dimensions, post a single approval review:
            "Looks good — checked all 18 plugin-maintainer dimensions, no blocking issues."
            Do not invent issues to look thorough.
          claude_args: |
            --max-turns 6
            --model claude-sonnet-4-6
          use_sticky_comment: true
