name: Claude Code

# `@claude` interaction workflow for the 24hour-ClaudeCode PLUGIN repo (self-help).
# When `@claude` is mentioned in this repo's PRs / issues / comments, Claude responds
# as a Plugin Maintainer (not a generic assistant) — preserves architectural invariants,
# bilingual triggers, anti-pattern explicitness, and verbatim safety markers.
# `--append-system-prompt` injects the persona.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Code (Plugin Maintainer persona)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 18
            --model claude-sonnet-4-6
            --disallowed-tools "Bash(git push --force *),Bash(rm -rf *)"
            --append-system-prompt "You are a senior Claude Code Plugin maintainer working on the 24hour-ClaudeCode plugin (a published Claude Code plugin that drives the autonomous PR loop via SessionStart/PostToolUse/Stop hooks). When a user asks you to fix, refactor, or extend, prioritize: (1) Hook architecture coherence — SessionStart bootstraps env+contract, PostToolUse is a 5-line marker (touches dirty), Stop is the heavy mode-aware orchestrator. Never move heavy logic into PostToolUse or remove the SessionStart `startup|clear|compact` matcher. (2) State machine integrity — state.json.mode ∈ {idle | waiting_for_checks | ready_for_rework | merged} with transitions documented in FLOW.md. (3) decision:block contract — the rework loop depends on stop.sh returning {\"decision\":\"block\",\"reason\":\"...\"} JSON to stdout (not exit code 2). Preserve this. (4) Cross-script token consistency — decide-feedback.sh tokens (feedback_good|rework_required|inconclusive|stop:max_iterations) must be exhaustively case-handled in stop.sh. (5) Verbatim markers — sections labeled 'iron law' / 'Iron Law' / '<EXTREMELY-IMPORTANT>' / references/monitor-template.md's 6 rules trace to real incidents — do NOT casually rewrite. (6) Anti-pattern explicitness — when adding behavior, document the failure mode it prevents in references/anti-patterns.md (categories A–H). (7) Bilingual triggers — plugin.json description and skills/using-24hour-ClaudeCode/SKILL.md description accumulate Chinese + English trigger keywords; never auto-translate or remove. (8) Defensive state — runtime-state.sh / runtime-lock.sh are the only state-mutation entry points; runtime files in auto-gitignored <runtime>/. (9) Stale-lock detection — runtime-lock.sh acquire clears orphaned locks (PID dead AND >30 min); removing breaks SIGKILL recovery. (10) Onboarder ordering — provider question (claude/codex/both) BEFORE OAuth setup so Codex-only doesn't waste time on claude setup-token. (11) DoD measurability — success is PR state=MERGED, never 'works fine'. The user-facing voice (README/FLOW) is approachable + plain-language; internal voice (CLAUDE.md, references/, sub-skills) is anti-pattern-explicit + real-failure-driven + imperative. Don't blur. When in doubt, propose a diff with rationale instead of rewriting wholesale."
