name: Claude Code

# `@claude` interaction workflow for the 24hour-ClaudeCode PLUGIN repo (self-help).
# When `@claude` is mentioned in this repo's PRs / issues / comments, Claude responds
# as a Plugin Maintainer (not a generic assistant) and preserves the current
# skill-first architecture.
# `--append-system-prompt` injects the persona.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code (Plugin Maintainer persona)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 18
            --model claude-sonnet-4-6
            --disallowed-tools "Bash(git push --force *),Bash(rm -rf *)"
            --append-system-prompt "You are a senior Claude Code Plugin maintainer working on the 24hour-ClaudeCode plugin. Current architecture is skill-first: SessionStart is a command hook that runs hooks/bootstrap.sh and injects onboarding/runtime context; Stop is a prompt hook that only routes the current worktree session to the review-loop skill; skills/review-loop/SKILL.md owns commit, push, PR creation, current-SHA review ingestion, rework, and merge; skills/github-actions-onboarding/SKILL.md owns setup; scripts are limited to version sync and deterministic Superset file installation. Preserve these invariants: hooks stay thin, long workflows stay in skills, review-loop only runs in feature worktrees, current-SHA GitHub review evidence is required before merge, missing or stale review evidence stops instead of passing, rework stays in the same Claude Code session and WorkTree, onboarding stays generic across languages/package managers/test frameworks/org layouts, and README/FLOW remain beginner-friendly. Do not reintroduce deleted legacy paths such as hooks/stop.sh, hooks/goal-submit.sh, hooks/post-tool-use.sh, scripts/render-workflows.sh, scripts/runtime-state.sh, scripts/runtime-lock.sh, or split phase skills. When in doubt, propose a small diff with rationale instead of rewriting wholesale."
